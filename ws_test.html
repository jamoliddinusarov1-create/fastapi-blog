<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WebSocket Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 0 15px;
    }
    #messages {
      border: 1px solid #ccc;
      border-radius: 6px;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
      background: #fafafa;
    }
    .msg-line {
      margin-bottom: 6px;
      word-wrap: break-word;
    }
    input {
      width: calc(70% - 10px);
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 8px 16px;
      margin-left: 5px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #1a73e8;
      color: white;
    }
    .btn-danger {
      background: #dc3545;
    }
    .sent {
      color: #0b5ed7;
    }
    .received {
      color: #198754;
    }
    .system {
      color: #6c757d;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h2>⚡ Oddiy WebSocket Test (/ws)</h2>
  <div id="messages"></div>
  <div style="display: flex; gap: 6px;">
    <input type="text" id="messageInput" placeholder="Xabar yozing..." />
    <button onclick="sendMessage()">Yuborish</button>
    <button class="btn-danger" onclick="disconnect()">Uzilish</button>
  </div>

  <script>
    const ws = new WebSocket("ws://localhost:8000/ws");
    const messages = document.getElementById("messages");
    const input = document.getElementById("messageInput");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = `msg-line ${type}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    ws.onopen = () => {
      addMessage("✅ Server ga ulandi!", "system");
    };

    ws.onmessage = (event) => {
      addMessage("Server: " + event.data, "received");
    };

    ws.onclose = () => {
      addMessage("❌ Ulanish yopildi", "system");
    };

    ws.onerror = (error) => {
      addMessage("⚠️ Xatolik yuz berdi", "system");
    };

    function sendMessage() {
      const message = input.value.trim();
      if (message && ws.readyState === WebSocket.OPEN) {
        addMessage("Siz: " + message, "sent");
        ws.send(message);
        input.value = "";
      }
    }

    function disconnect() {
      ws.close();
    }

    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
