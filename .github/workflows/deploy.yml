name: Test and Deploy FastAPI to EC2

on:
  push:
    branches:
      - main

jobs:
  # 1-BOSQICH: Testlarni tekshirish
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kerakli kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pytest-cov

      - name: Pytest bilan testlarni yurgizish
        env:
          DATABASE_URL: sqlite:///test.db
          SECRET_KEY: test-secret-key-for-github-actions
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
        run: |
          pytest

  # 2-BOSQICH: Agar testlar muvaffaqiyatli o'tsagina, Serverga yuklash
  deploy:
    needs: test  # <-- Testlar o'tmaguncha deploy boshlanmaydi!
    runs-on: ubuntu-latest
    steps:
      - name: Connect and deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/fastapi-blog
            git pull origin main
            chmod +x deploy.sh
            ./deploy.sh