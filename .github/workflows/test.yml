name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:////tmp/ci.sqlite3
      SECRET_KEY: ci-only-secret-key-not-used-in-production-0123456789
      DEBUG: "False"

    steps:
      - name: Чек-аут репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Обновление pip и установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.txt -r requirements/requirements-dev.txt
          pip install ruff pytest pytest-django

      - name: Линтер (ruff check)
        run: python -m ruff check .

      - name: Проверка форматирования (ruff format)
        run: python -m ruff format --check .

      - name: Проверка конфигурации Django
        run: python manage.py check

      - name: Проверка миграций (drift check)
        run: python manage.py makemigrations --check --dry-run

      - name: Проверка OpenAPI схемы
        run: python manage.py spectacular --file /tmp/schema.yml --validate

      - name: Запуск тестов (pytest)
        run: python -m pytest